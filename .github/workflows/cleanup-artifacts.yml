# Cleanup old artifacts — PROPOSED CORRECTION (not active).
#
# Hamza's policy (2026-10-10): keep only the 10 latest
# 'Render Production (Chunked Parallel)' RUNS; when a new run makes 11,
# delete the OLDEST run's artifacts — never the latest.
#
# Why this replaces the previous version:
# - The old version kept the 10 newest ARTIFACTS repo-wide. A single 39-chunk
#   production run is ~40 artifacts, so one render could wipe every other
#   run's artifacts — including the chunks the assembly-only recovery law
#   depends on. It also touched other workflows' artifacts.
# - This version counts RUNS of the production workflow only, keeps the 10
#   most recent completed runs plus every in-progress run, and deletes only
#   the older runs' artifacts. Other workflows are never touched.
# - Recovery/investigation protection: runs whose conclusion is not success
#   (failure, cancelled, timed out) are NEVER deleted by this workflow.
#   Failed runs are exactly what the assembly-only recovery law and
#   post-mortems depend on; their artifacts survive until a human clears them.
#
# NOT ACTIVE until explicitly approved AND present on the default branch
# (workflow_run triggers only fire from the default branch).
name: Cleanup Old Artifacts

on:
  workflow_run:
    workflows: ["Render Production (Chunked Parallel)"]
    types: [completed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete artifacts of production runs older than the 10 most recent
        uses: actions/github-script@v7
        with:
          script: |
            const KEEP_RUNS = 10;
            const TARGET = "Render Production (Chunked Parallel)";
            const ACTIVE_STATES = ["in_progress", "queued", "waiting", "requested"];

            // 1. Resolve the production workflow by exact name.
            const wfList = await github.paginate(
              github.rest.actions.listWorkflowsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const wf = wfList.find(w => w.name === TARGET);
            if (!wf) {
              console.log(`workflow not found: ${TARGET}; nothing to do`);
              return;
            }

            // 2. Newest-first. In-progress runs are never counted against the
            //    keep budget and never deleted from. Failed runs are never
            //    deleted either (recovery/investigation protection): the
            //    assembly-only recovery law needs their chunks.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              { owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: wf.id, per_page: 100 }
            );
            runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const active = runs.filter(r => ACTIVE_STATES.includes(r.status));
            const failed = runs.filter(r =>
              r.status === "completed" && r.conclusion !== "success");
            const succeeded = runs.filter(r =>
              r.status === "completed" && r.conclusion === "success");
            const keepIds = new Set([
              ...active.map(r => r.id),
              ...failed.map(r => r.id),
              ...succeeded.slice(0, KEEP_RUNS).map(r => r.id),
            ]);
            const victims = succeeded.slice(KEEP_RUNS);
            console.log(
              `runs: ${runs.length} (active ${active.length}, ` +
              `failed-protected ${failed.length}, ` +
              `succeeded ${succeeded.length}); keeping ${keepIds.size}, ` +
              `deleting artifacts of ${victims.length} old successful runs`
            );
            if (victims.length === 0) {
              console.log("nothing to delete");
              return;
            }

            // 3. Delete ONLY the old production runs' artifacts. Nothing else.
            for (const r of victims) {
              const arts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                { owner: context.repo.owner, repo: context.repo.repo,
                  run_id: r.id, per_page: 100 }
              );
              for (const a of arts) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner, repo: context.repo.repo,
                  artifact_id: a.id,
                });
                console.log(`Deleted: run ${r.id} artifact ${a.name} (${a.id})`);
              }
            }
