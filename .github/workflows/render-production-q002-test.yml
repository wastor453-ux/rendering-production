name: Render Production Q-002 Test (Failure Injection)

# P4.1: Dedicated TEST-ONLY workflow for Q-002 selective-recovery validation.
# This workflow is NEVER used for production. It exists solely to deliberately
# fail one chunk before rendering, proving that the recovery system handles
# partial failures correctly.
#
# The production workflow (.github/workflows/render-production.yml) contains
# NO failure hook. This separation ensures the hook cannot leak into production.

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion composition ID'
        required: true
        default: 'P3Rehearsal'
      start_frame:
        description: 'First frame (inclusive)'
        required: true
        default: '0'
      end_frame:
        description: 'Last frame (inclusive)'
        required: true
        default: '599'
      chunk_size:
        description: 'Frames per chunk'
        required: false
        default: '30'
      fail_chunk:
        description: 'Deliberately fail this chunk ID before rendering'
        required: true
      resume_from_run_id:
        description: 'Resume from prior run (for recovery testing)'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  test-failure-injection:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate composition is registered (R-2 contract)
        # Test-only workflow, but the composition must still be a known
        # registered id — unregistered ids fail closed before any rendering.
        run: |
          set -euo pipefail
          python3 -c "
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from composition_contract import get_contract
          cid = os.environ['COMPOSITION']
          if get_contract(cid) is None:
              print(f'FATAL: composition {cid!r} is not registered in the composition contract', file=sys.stderr)
              sys.exit(1)
          print(f'Composition {cid!r} is registered.')
          "
        env:
          COMPOSITION: ${{ inputs.composition }}

      - name: D4 blocking QA enforcement point
        # D4 blocking enforcement point — active once the render+resume harness
        # lands; skipped until then. The `render` step does not exist yet, so
        # this condition is false today and the stub still reaches its
        # deliberate failure unchanged. When the harness lands, `render` must
        # expose `master_path` as an output; this step then audits the master
        # and (no continue-on-error) FAILS the workflow on violation.
        if: ${{ steps.render.outputs.master_path != '' }}
        run: |
          set -euo pipefail
          node scripts/verify-render.js --mode production \
            --comp "$COMPOSITION" \
            --manifest audio_manifest.json \
            --report verify-report.json
        env:
          COMPOSITION: ${{ inputs.composition }}

      - name: Validate test inputs via environment
        # P4.1: No raw ${{ inputs.* }} interpolation in shell. All inputs
        # pass through env vars with quoted expansions.
        run: |
          set -euo pipefail
          echo "Test composition: $COMPOSITION"
          echo "Fail chunk: $FAIL_CHUNK"
          echo "Frames: $START_FRAME to $END_FRAME"
        env:
          COMPOSITION: ${{ inputs.composition }}
          FAIL_CHUNK: ${{ inputs.fail_chunk }}
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}

      - name: Deliberate failure injection (test only)
        # P4.1: Failure injection via env vars, not shell interpolation.
        # This job fails deliberately to simulate a chunk failure.
        run: |
          set -euo pipefail
          echo "Q-002 TEST: Simulating failure for chunk $FAIL_CHUNK"
          echo "This is a controlled test failure, not a production error."
          exit 1
        env:
          FAIL_CHUNK: ${{ inputs.fail_chunk }}
