# CI — hosted test evidence for COSMO P4.4
#
# Runs on pushes/PRs to the readiness branch and on manual dispatch.
# - python-tests: full repo test suite (400 tests, unittest discover)
# - gate-negative-paths: vendored gate engine against isolated fixtures
#   (S7 invalid beats, D-002 unapproved mode, S9 incomplete ledger,
#    with_audio=false / true paths). No production artifacts touched.
#
# Permissions are minimal (contents: read). No secrets used.

name: CI

on:
  push:
    branches: [p4-4-ccdecbc-readiness]
  pull_request:
    branches: [p4-4-ccdecbc-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          pip install pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run full test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests > /tmp/test_out.txt 2>&1 || true
          grep -E "^(OK|FAILED|Ran)" /tmp/test_out.txt | head -5
          if grep -q "^FAILED" /tmp/test_out.txt; then
            echo "=== FAILURES & ERRORS ==="
            grep -B2 -A10 "^\(FAIL\|ERROR\):" /tmp/test_out.txt | head -80
            exit 1
          fi

  gate-negative-paths:
    name: Gate engine negative paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: S7 rejects invalid beats
        run: |
          set -euo pipefail
          mkdir -p /tmp/gatefix
          echo '{"no_beats": true}' > /tmp/gatefix/bad.json
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=/tmp/gatefix/bad.json" \
            --registry /tmp/gatefix/r.json --run-id neg1 --kind json
          if HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r.json --run-id neg1; then
            echo "FAIL: S7 accepted invalid beats"; exit 1
          fi
          echo "PASS: S7 rejected invalid beats (exit 2)"
      - name: D-002 rejects unapproved visual mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b = json.load(open("src/compiled_p3/beat_timeline.json"))
          b["beats"][0]["visual_mode"] = "dark_mystery_hacker"
          json.dump(b, open("/tmp/gatefix/badmode.json", "w"))
          PY
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=/tmp/gatefix/badmode.json" \
            --registry /tmp/gatefix/r2.json --run-id neg2 --kind json
          python3 .github/scripts/pipeline_check.py \
            --define "visual_modes_schema=src/visual_mode_schema.json" \
            --registry /tmp/gatefix/r2.json --run-id neg2
          if HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r2.json --run-id neg2; then
            echo "FAIL: S7 accepted unapproved mode"; exit 1
          fi
          echo "PASS: D-002 rejected unapproved mode (exit 2)"
      - name: S7 accepts valid beats and approved modes
        run: |
          set -euo pipefail
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=src/compiled_p3/beat_timeline.json" \
            --registry /tmp/gatefix/r3.json --run-id pos1 --kind json
          python3 .github/scripts/pipeline_check.py \
            --define "visual_modes_schema=src/visual_mode_schema.json" \
            --registry /tmp/gatefix/r3.json --run-id pos1
          HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r3.json --run-id pos1
          echo "PASS: S7 accepted valid beats (exit 0)"
      - name: S9 rejects incomplete ledger
        run: |
          set -euo pipefail
          echo '{"chunks": []}' > /tmp/gatefix/empty_ledger.json
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=false" \
            --registry /tmp/gatefix/r4.json --run-id neg3
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/empty_ledger.json" \
            --registry /tmp/gatefix/r4.json --run-id neg3 --kind json
          if python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/r4.json --run-id neg3; then
            echo "FAIL: S9 accepted incomplete ledger"; exit 1
          fi
          echo "PASS: S9 rejected incomplete ledger (exit 2)"
      - name: S9 audio modes (regression)
        run: |
          set -euo pipefail
          # Valid isolated ledger fixture (chunk-ledger kind, complete)
          python3 - <<'PY'
          import json
          ledger = {"kind": "chunk-ledger", "expected_chunks": 2, "ok_chunks": 2,
                    "complete": True,
                    "entries": [{"chunk_id": 0, "status": "rendered_ok"},
                                {"chunk_id": 1, "status": "rendered_ok"}]}
          json.dump(ledger, open("/tmp/gatefix/ledger_ok.json", "w"))
          # tiny valid WAV (44-byte header + silence) as mixed_audio fixture
          import wave, struct
          w = wave.open("/tmp/gatefix/audio.wav", "w")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
          w.writeframes(struct.pack("<100h", *([0]*100)))
          w.close()
          PY
          echo "--- case 1: with_audio=false, no mixed_audio -> PASS ---"
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=false" \
            --registry /tmp/gatefix/ra1.json --run-id aud1
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/ledger_ok.json" \
            --registry /tmp/gatefix/ra1.json --run-id aud1 --kind json
          python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/ra1.json --run-id aud1
          echo "PASS: with_audio=false accepted without mixed_audio"
          echo "--- case 2: with_audio=true, no mixed_audio -> FAIL (exit 2) ---"
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=true" \
            --registry /tmp/gatefix/ra2.json --run-id aud2
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/ledger_ok.json" \
            --registry /tmp/gatefix/ra2.json --run-id aud2 --kind json
          if python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/ra2.json --run-id aud2; then
            echo "FAIL: S9 accepted audio mode without mixed_audio"; exit 1
          fi
          echo "PASS: with_audio=true rejected without mixed_audio (exit 2)"
          echo "--- case 3: with_audio=true, valid mixed_audio -> PASS ---"
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=true" \
            --registry /tmp/gatefix/ra3.json --run-id aud3
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/ledger_ok.json" \
            --registry /tmp/gatefix/ra3.json --run-id aud3 --kind json
          python3 .github/scripts/pipeline_check.py \
            --register "mixed_audio=/tmp/gatefix/audio.wav" \
            --registry /tmp/gatefix/ra3.json --run-id aud3 --kind media
          python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/ra3.json --run-id aud3
          echo "PASS: with_audio=true accepted with valid mixed_audio"
      - name: S11 strict mode (release gate)
        run: |
          set -euo pipefail
          # S11 requires: final_mix, qa_report (QA PASS), release_auth, + 8 completion records
          python3 - <<'PY'
          import json, wave, struct
          # minimal final_mix (valid media file)
          w = wave.open("/tmp/gatefix/final_mix.wav", "w")
          w.setnchannels(1); w.setsampwidth(2); w.setframerate(44100)
          w.writeframes(struct.pack("<100h", *([0]*100))); w.close()
          # qa_report with verify_render PASS
          qa = {"verify_render": "PASS", "gate0_editorial": True}
          json.dump(qa, open("/tmp/gatefix/qa.json", "w"))
          PY
          echo "--- S11 without completions -> FAIL ---"
          python3 .github/scripts/pipeline_check.py \
            --require-completions \
            --registry /tmp/gatefix/rs11.json --run-id s11test
          python3 .github/scripts/pipeline_check.py \
            --register "final_mix=/tmp/gatefix/final_mix.wav" \
            --registry /tmp/gatefix/rs11.json --run-id s11test --kind media
          python3 .github/scripts/pipeline_check.py \
            --register "qa_report=/tmp/gatefix/qa.json" \
            --registry /tmp/gatefix/rs11.json --run-id s11test --kind json
          if python3 .github/scripts/pipeline_check.py \
            --stage S11_release --registry /tmp/gatefix/rs11.json --run-id s11test; then
            echo "FAIL: S11 passed without completions"; exit 1
          fi
          echo "PASS: S11 rejected without completion records (exit 2)"
          echo "--- S11 with completions but no release_auth -> FAIL ---"
          for s in S1_discovery S2_selection S3_transcript S4_script S5_voice S6_planning S8_sound S10_qa; do
            python3 .github/scripts/pipeline_check.py \
              --record-completion "$s" \
              --registry /tmp/gatefix/rs11.json --run-id s11test
          done
          if python3 .github/scripts/pipeline_check.py \
            --stage S11_release --registry /tmp/gatefix/rs11.json --run-id s11test; then
            echo "FAIL: S11 passed without release_auth"; exit 1
          fi
          echo "PASS: S11 rejected without release authorization (exit 2)"
