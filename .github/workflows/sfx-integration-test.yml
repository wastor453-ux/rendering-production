name: SFX Integration Test (bounded)

# Short, bounded SFX chain test on the GitHub runner. Does NOT render video,
# does NOT dispatch production, does NOT touch main. Proves the runner can
# see all 180 A1 assets and execute the full VO+bed+SFX chain.
on:
  workflow_dispatch:

jobs:
  sfx-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify A1 library (180 WAVs)
        run: |
          set -euo pipefail
          COUNT=$(find assets/a1 -name '*.wav' | wc -l)
          echo "A1 WAVs on runner: $COUNT"
          [ "$COUNT" -eq 180 ] || { echo "FAIL: expected 180, got $COUNT"; exit 1; }
          python3 - <<'PY'
          import json
          m = json.load(open('assets/a1/MANIFEST.json'))
          assert len(m['assets']) == 180, f"manifest has {len(m['assets'])} assets"
          print(f"manifest OK: {len(m['assets'])} assets")
          PY

      - name: Compile triggers
        run: |
          set -euo pipefail
          python3 tools/compile_sfx_triggers_a1.py \
            --events assets/sfx/housingbroke_events.json \
            --manifest assets/a1/MANIFEST.json \
            --asset-map assets/sfx/housingbroke_assetmap.json \
            --out /tmp/sfx_triggers.json --fps 30
          python3 -c "import json; t=json.load(open('/tmp/sfx_triggers.json')); print('triggers:', len(t['triggers']))"

      - name: Build synthetic VO + bed inputs
        # The real vo_housingbroke.wav is gitignored (73MB); the chain
        # mechanics are identical with a synthetic VO that has clear
        # speech-like activity bursts for the ducking detector.
        run: |
          set -euo pipefail
          ffmpeg -v error -y -f lavfi -i "sine=frequency=220:duration=10" \
            -af "volume='if(between(t,1,3)+between(t,5,7),1,0.02)':eval=frame" \
            -ar 48000 -ac 1 /tmp/vo_synth.wav
          ffmpeg -v error -y -i public/audio/bed.mp3 -t 10 -ar 48000 -ac 1 /tmp/bed_10s.wav
          echo "inputs ready"

      - name: Dry-run (validates timing, ducking, bed, filter graph)
        run: |
          set -euo pipefail
          python3 tools/mix_sfx.py --dry-run \
            --triggers /tmp/sfx_triggers.json \
            --vo /tmp/vo_synth.wav \
            --bed /tmp/bed_10s.wav \
            --a1-dir assets/a1 2>&1 | tee /tmp/dryrun.log
          grep -q "FILTER GRAPH" /tmp/dryrun.log

      - name: Bounded 10s test render
        run: |
          set -euo pipefail
          python3 tools/mix_sfx.py --test-seconds 10 \
            --triggers /tmp/sfx_triggers.json \
            --vo /tmp/vo_synth.wav \
            --bed /tmp/bed_10s.wav \
            --a1-dir assets/a1 \
            --out /tmp/sfx_test_10s.wav

      - name: Verify output (duration, rate, loudness, provenance)
        run: |
          set -euo pipefail
          DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/sfx_test_10s.wav)
          SR=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of default=noprint_wrappers=1:nokey=1 /tmp/sfx_test_10s.wav)
          echo "duration=$DUR sample_rate=$SR"
          python3 -c "d=float('$DUR'); assert abs(d-10.0) < 0.05, d"
          [ "$SR" = "48000" ] || { echo "FAIL: sample rate $SR"; exit 1; }
          ffmpeg -v error -i /tmp/sfx_test_10s.wav -af loudnorm=print_format=json -f null - 2> /tmp/loud.json || true
          python3 - <<'PY'
          import json, re
          raw = open('/tmp/loud.json').read()
          m = re.search(r'\{.*\}', raw, re.S)
          stats = json.loads(m.group(0))
          print("integrated LUFS:", stats['input_i'], "| true peak:", stats['input_tp'])
          assert abs(float(stats['input_i']) - (-14)) < 1.5, stats['input_i']
          assert float(stats['input_tp']) <= -1.0 + 0.5, stats['input_tp']
          print("loudness OK")
          PY
          echo "--- provenance: first 5 SFX used ---"
          grep -oE "[a-z0-9-]+\.wav" /tmp/dryrun.log | sort -u | head -5

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfx-integration-${{ github.run_id }}
          path: |
            /tmp/sfx_test_10s.wav
            /tmp/dryrun.log
            /tmp/loud.json
          retention-days: 30
