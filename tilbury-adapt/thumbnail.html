<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1280px;height:720px;background:#FAFAF8;
    background-image:radial-gradient(#E0E0EE 1.3px, transparent 1.3px);
    background-size:34px 34px;
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;position:relative}
  .hairline{position:absolute;top:0;left:0;right:0;height:10px;
    background:linear-gradient(90deg,#4F46E5,#8B5CF6,#4F46E5)}
  .kicker{position:absolute;top:44px;left:64px;font-size:26px;font-weight:800;
    letter-spacing:8px;color:#4F46E5}
  .card{background:#fff;border:1px solid #ECECF3;border-radius:28px;
    padding:56px 88px;text-align:center;box-shadow:0 8px 32px rgba(79,70,229,.07)}
  .num{font-size:190px;font-weight:800;color:#1A1B25;line-height:1;letter-spacing:-4px}
  .cap{font-size:34px;color:#8A8AA3;margin-top:18px;font-weight:600}
  .chip{display:inline-block;margin-top:26px;background:#E5484D;color:#fff;
    font-size:28px;font-weight:800;letter-spacing:3px;padding:12px 30px;border-radius:999px}
</style></head><body>
<div class="hairline"></div>
<div class="kicker">THE SILENT THIEF</div>
<div class="card">
  <div class="num">$2.80</div>
  <div class="cap">what your $1 buys now</div>
  <div class="chip">⅔ GONE</div>
</div>
</body></html>
