name: Repair Safety Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ["repair/**"]

permissions:
  contents: read

jobs:
  safe-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify Remotion compositions bundle
        run: npm run check:bundle
