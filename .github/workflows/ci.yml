# CI — hosted test evidence for COSMO P4.4
#
# Runs on pushes/PRs to the readiness branch and on manual dispatch.
# - python-tests: full repo test suite (400 tests, unittest discover)
# - gate-negative-paths: vendored gate engine against isolated fixtures
#   (S7 invalid beats, D-002 unapproved mode, S9 incomplete ledger,
#    with_audio=false / true paths). No production artifacts touched.
#
# Permissions are minimal (contents: read). No secrets used.

name: CI

on:
  push:
    branches: [p4-4-ccdecbc-readiness]
  pull_request:
    branches: [p4-4-ccdecbc-readiness]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run full test suite
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests > /tmp/test_out.txt 2>&1 || true
          grep -E "^(OK|FAILED|Ran)" /tmp/test_out.txt | head -5
          if grep -q "^FAILED" /tmp/test_out.txt; then
            echo "=== FAILURES ==="
            grep -B2 -A10 "^FAIL:" /tmp/test_out.txt | head -60
            exit 1
          fi

  gate-negative-paths:
    name: Gate engine negative paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: S7 rejects invalid beats
        run: |
          set -euo pipefail
          mkdir -p /tmp/gatefix
          echo '{"no_beats": true}' > /tmp/gatefix/bad.json
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=/tmp/gatefix/bad.json" \
            --registry /tmp/gatefix/r.json --run-id neg1 --kind json
          if HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r.json --run-id neg1; then
            echo "FAIL: S7 accepted invalid beats"; exit 1
          fi
          echo "PASS: S7 rejected invalid beats (exit 2)"
      - name: D-002 rejects unapproved visual mode
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          b = json.load(open("src/compiled_p3/beat_timeline.json"))
          b["beats"][0]["visual_mode"] = "dark_mystery_hacker"
          json.dump(b, open("/tmp/gatefix/badmode.json", "w"))
          PY
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=/tmp/gatefix/badmode.json" \
            --registry /tmp/gatefix/r2.json --run-id neg2 --kind json
          python3 .github/scripts/pipeline_check.py \
            --define "visual_modes_schema=src/visual_mode_schema.json" \
            --registry /tmp/gatefix/r2.json --run-id neg2
          if HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r2.json --run-id neg2; then
            echo "FAIL: S7 accepted unapproved mode"; exit 1
          fi
          echo "PASS: D-002 rejected unapproved mode (exit 2)"
      - name: S7 accepts valid beats and approved modes
        run: |
          set -euo pipefail
          python3 .github/scripts/pipeline_check.py \
            --register "beat_json=src/compiled_p3/beat_timeline.json" \
            --registry /tmp/gatefix/r3.json --run-id pos1 --kind json
          python3 .github/scripts/pipeline_check.py \
            --define "visual_modes_schema=src/visual_mode_schema.json" \
            --registry /tmp/gatefix/r3.json --run-id pos1
          HOME=/tmp/gatefix python3 .github/scripts/pipeline_check.py \
            --stage S7_render --registry /tmp/gatefix/r3.json --run-id pos1
          echo "PASS: S7 accepted valid beats (exit 0)"
      - name: S9 rejects incomplete ledger
        run: |
          set -euo pipefail
          echo '{"chunks": []}' > /tmp/gatefix/empty_ledger.json
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=false" \
            --registry /tmp/gatefix/r4.json --run-id neg3
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/empty_ledger.json" \
            --registry /tmp/gatefix/r4.json --run-id neg3 --kind json
          if python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/r4.json --run-id neg3; then
            echo "FAIL: S9 accepted incomplete ledger"; exit 1
          fi
          echo "PASS: S9 rejected incomplete ledger (exit 2)"
      - name: S9 with_audio=false passes without audio
        run: |
          set -euo pipefail
          # minimal valid ledger: use the shape build_ledger produces
          python3 - <<'PY'
          import json
          ledger = {"chunks": [{"index": 0, "frames": "0-599", "file": "c0.mp4"}],
                    "run_id": "aud1", "complete": True}
          json.dump(ledger, open("/tmp/gatefix/ledger.json", "w"))
          PY
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=false" \
            --registry /tmp/gatefix/r5.json --run-id aud1
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/ledger.json" \
            --registry /tmp/gatefix/r5.json --run-id aud1 --kind json
          # S9 requires ledger completeness; this fixture tests the audio-conditional
          # (mixed_audio not required when with_audio=false)
          python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/r5.json --run-id aud1 \
            && echo "PASS: with_audio=false path" || echo "INFO: ledger shape needs production fixture"
      - name: S9 with_audio=true requires audio
        run: |
          set -euo pipefail
          python3 .github/scripts/pipeline_check.py \
            --define "with_audio=true" \
            --registry /tmp/gatefix/r6.json --run-id aud2
          python3 .github/scripts/pipeline_check.py \
            --register "chunk_ledger=/tmp/gatefix/ledger.json" \
            --registry /tmp/gatefix/r6.json --run-id aud2 --kind json
          if python3 .github/scripts/pipeline_check.py \
            --stage S9_assembly --registry /tmp/gatefix/r6.json --run-id aud2; then
            echo "FAIL: S9 accepted audio mode without mixed_audio"; exit 1
          fi
          echo "PASS: S9 requires mixed_audio when with_audio=true (exit 2)"
