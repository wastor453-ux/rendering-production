name: Render Production (Chunked Parallel)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion composition ID'
        required: true
        default: 'P3Rehearsal'
      label:
        description: 'Human-readable label (display only, NOT used for artifact identity)'
        required: false
        default: ''
      start_frame:
        description: 'First frame (inclusive)'
        required: true
        default: '0'
      end_frame:
        description: 'Last frame (inclusive)'
        required: true
      chunk_size:
        description: 'Frames per chunk'
        required: false
        default: '600'
      max_parallel:
        description: 'Max parallel chunk jobs'
        required: false
        default: '20'
      crf:
        description: 'H.264 CRF (quality)'
        required: false
        default: '18'
      with_audio:
        description: 'Mux canonical VO+music mix'
        required: false
        type: boolean
        default: true
      vo_file:
        description: 'VO source (relative to repo root)'
        required: false
        default: 'public/audio/vo_p3.wav'
      bed_file:
        description: 'Music bed source (relative to repo root)'
        required: false
        default: 'public/audio/bed.mp3'
      resume_from_run_id:
        description: 'P3.12: resume from a prior run ID (explicit). Empty = fresh render. The prior run is strictly validated (generation fingerprint, assets, env) before any chunk is reused.'
        required: false
        default: ''
      reassemble_bypass_fingerprint:
        description: 'P4.4 SPLIT (§6.1): assembly-only reassembly mode. Declares zero render jobs expected. The split fingerprint (render vs assembly vs audio) means assembly-logic changes no longer invalidate chunks — this flag selects mode, not a validation bypass. Use ONLY for re-assembly, never for re-rendering.'
        required: false
        type: boolean
        default: false
      # NOTE (P3.12): the old unsafe resume_from was removed in P3.5.2.
      # resume_from_run_id is its safe replacement: explicit prior-run
      # selection with generation-fingerprint validation, not filename
      # matching. Do NOT use `gh run rerun --failed`: recovery uses a new
      # workflow_dispatch with its own canonical execution identity.

env:
  NODE_VERSION: '24.20.0'
  REMOTION_VERSION: '4.0.532'
  # P4.3 R-008: Ubuntu snapshot for reproducible system packages.
  # Format: YYYYMMDDTHHMMSSZ. Empty = use regular archive (rolling).
  # Snapshot is HTTPS-only, signed with official Ubuntu key.
  UBUNTU_SNAPSHOT: '20260820T000000Z'
  # Custom runner-image label. Do NOT name this RUNNER_OS — that is a GitHub
  # reserved variable (always "Linux" on ubuntu runners).
  RUNNER_IMAGE: 'ubuntu-24.04'

# P3.12: actions:read is required for resume_from_run_id — the plan job
# lists and downloads the prior run's artifacts via the GitHub API.
# Contents are read-only; no write permissions are granted.
permissions:
  contents: read
  actions: read

jobs:
  # --- Job 1: Generate canonical identity + chunk plan + job manifest ---
  plan:
    runs-on: ubuntu-24.04
    # P4.4 R-013: Fail-fast on stale reruns. GitHub may permit reruns against
    # an older workflow revision. Fresh dispatch is the required path.
    # A rerun (attempt > 1) must fail before any rendering or publication.
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      job_identity: ${{ steps.identity.outputs.job_identity }}
      generation_fingerprint: ${{ steps.manifest.outputs.generation_fingerprint }}
      zero_render: ${{ steps.set.outputs.zero_render }}
    steps:
      - uses: actions/checkout@v4

      - name: R-013 stale-rerun guard
        run: |
          set -euo pipefail
          ATTEMPT="${{ github.run_attempt }}"
          if [ "$ATTEMPT" -gt 1 ]; then
            echo "FATAL: R-013 - This is run attempt $ATTEMPT (a rerun)." >&2
            echo "Stale reruns may execute incompatible workflow logic." >&2
            echo "Use fresh workflow_dispatch for a new source revision." >&2
            echo "The canonical job identity includes the attempt number," >&2
            echo "so this run cannot silently reuse prior artifacts." >&2
            exit 1
          fi
          echo "R-013 guard passed: fresh dispatch (attempt 1)"

      - name: Setup Node (for manifest version measurement)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - id: identity
        name: Generate canonical job identity
        run: |
          set -euo pipefail
          JOB_ID=$(python3 .github/scripts/job_identity.py generate \
            "${{ github.run_id }}" "${{ github.run_attempt }}" "${{ github.sha }}")
          echo "Canonical job identity: $JOB_ID"
          # Label via env var (validated by plan.py); display only
          echo "Label (display only): $LABEL"
          # Validate before starting expensive rendering (P0 requirement 8)
          python3 .github/scripts/job_identity.py validate "$JOB_ID"
          echo "job_identity=$JOB_ID" >> $GITHUB_OUTPUT
        env:
          LABEL: ${{ inputs.label }}

      - id: manifest
        name: Build job manifest
        run: |
          set -euo pipefail
          # P3.6.2: planning logic extracted to .github/scripts/plan.py
          # (testable module; all inputs via env vars, validated inside).
          python3 .github/scripts/plan.py
        env:
          JOB_IDENTITY: ${{ steps.identity.outputs.job_identity }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
          COMPOSITION: ${{ inputs.composition }}
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          CRF: ${{ inputs.crf }}
          WITH_AUDIO: ${{ inputs.with_audio }}
          VO_FILE: ${{ inputs.vo_file }}
          BED_FILE: ${{ inputs.bed_file }}
          LABEL: ${{ inputs.label }}
          OUTPUT_DIR: /tmp/job
          REPO_ROOT: .

      - name: P4.4 audio duration guard
        # Fail fast if VO is too short for the video duration.
        # This caused 5 Q-004 assembly failures (placeholder 83s VO vs 771s video).
        # The bed loops, so only the VO is strictly validated.
        # P3.6.2: inputs via env vars, not raw interpolation.
        if: inputs.with_audio == true
        env:
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          VO_FILE: ${{ inputs.vo_file }}
        run: |
          set -euo pipefail
          FPS=30
          # Use python instead of bc (bc may not be installed)
          VIDEO_DUR=$(python3 -c "print(($END_FRAME - $START_FRAME + 1) / $FPS)")
          echo "Video duration: ${VIDEO_DUR}s"
          # P4.4: VO may be built on-runner from hb_p1..hb_p7 in assemble job.
          # If not present here, verify the parts exist.
          if [ ! -f "$VO_FILE" ]; then
            if [[ "$VO_FILE" == *"vo_housingbroke.wav" ]]; then
              echo "VO not yet built, checking parts..."
              for i in 1 2 3 4 5 6 7; do
                [ -f "public/audio/hb_p${i}.wav" ] || {
                  echo "FATAL: VO part missing: public/audio/hb_p${i}.wav" >&2
                  exit 1
                }
              done
              echo "All 7 VO parts present, will be concatenated in assemble job"
              # Skip duration check (parts validated individually below)
              echo "VO parts OK, skipping duration guard"
              exit 0
            else
              echo "FATAL: VO file not found: $VO_FILE" >&2
              exit 1
            fi
          fi
          # Check for LFS pointer
          if head -c 100 "$VO_FILE" | grep -q "version https://git-lfs.github.com"; then
            echo "FATAL: VO is a Git LFS pointer, not real audio: $VO_FILE" >&2
            exit 1
          fi
          VO_DUR=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$VO_FILE")
          echo "VO duration: ${VO_DUR}s ($VO_FILE)"
          # Fail if VO is more than 30s shorter than video
          VIDEO_DUR="$VIDEO_DUR" VO_DUR="$VO_DUR" python3 -c "
          import os, sys
          video_dur = float(os.environ['VIDEO_DUR'])
          vo_dur = float(os.environ['VO_DUR'])
          gap = video_dur - vo_dur
          if gap > 30:
              print(f'FATAL: VO too short: {vo_dur:.1f}s < video {video_dur:.1f}s '
                    f'(gap {gap:.1f}s). Concatenate all VO parts first.', file=sys.stderr)
              sys.exit(1)
          elif gap > 0:
              print(f'WARNING: VO {vo_dur:.1f}s slightly shorter than video '
                    f'{video_dur:.1f}s (gap {gap:.1f}s)')
          else:
              print(f'VO duration OK: {vo_dur:.1f}s >= video {video_dur:.1f}s')
          "

      - id: recovery
        name: Plan recovery from prior run (if requested)
        if: inputs.resume_from_run_id != ''
        run: |
          set -euo pipefail
          # P3.12: validate the prior run and compute which chunks can be
          # reused. Fail closed: any validation error stops the workflow
          # before expensive rendering. Never silently full-renders.
          # P4.0: capture output for debugging
          python3 .github/scripts/recovery_plan.py 2>&1 | tee /tmp/recovery_plan.log
          test ${PIPESTATUS[0]} -eq 0
        env:
          RESUME_FROM_RUN_ID: ${{ inputs.resume_from_run_id }}
          REASSEMBLE_BYPASS_FINGERPRINT: ${{ inputs.reassemble_bypass_fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          JOB_MANIFEST: /tmp/job/job_manifest.json
          OUTPUT_DIR: /tmp/job

      - name: Upload recovery plan log (debug)
        if: always() && inputs.resume_from_run_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: recovery-plan-log
          path: /tmp/recovery_plan.log
          retention-days: 3

      - id: set
        name: Generate chunk matrix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          # P3.12: when resuming, render only the chunks the resume plan
          # marked for rendering. Otherwise render the full plan.
          # P3.12.1: zero-render resume (all chunks reusable) produces an
          # empty matrix; the render job is skipped and assembly proceeds
          # with prior chunks only. This is valid, not an error.
          resume_path = '/tmp/job/render_matrix.json'
          plan_path = '/tmp/job/resume_plan.json'
          zero_render = False
          if os.path.exists(resume_path):
              with open(resume_path) as f:
                  chunks = json.load(f)
              print(f"Resume: rendering {len(chunks)} chunks "
                    f"(others reused from prior run)")
              if len(chunks) == 0:
                  zero_render = True
                  print("Zero-render resume: all chunks reusable; "
                        "render job will be skipped, assembly proceeds")
          else:
              with open('/tmp/job/job_manifest.json') as f:
                  m = json.load(f)
              chunks = m['plan']['chunks']
              print(f"Planning {len(chunks)} chunks for job {m['job_identity']}")
              # Fresh render: write a disabled resume plan so the artifact
              # upload has a consistent file set.
              with open(plan_path, 'w') as f:
                  json.dump({"enabled": False}, f)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps({'chunk': chunks})}\n")
              f.write(f"zero_render={'true' if zero_render else 'false'}\n")
          PY

      - name: Upload job manifest
        uses: actions/upload-artifact@v4
        with:
          name: job-${{ steps.identity.outputs.job_identity }}
          path: |
            /tmp/job/job_manifest.json
            /tmp/job/asset_manifest.json
            /tmp/job/resume_plan.json
          retention-days: 30

  # --- Job 2: Render chunks in parallel (matrix) ---
  render-chunk:
    needs: plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Preflight system dependencies
        id: preflight
        run: |
          set -euo pipefail
          # Render jobs need chromium libs only (ffmpeg not used for rendering)
          if python3 .github/scripts/preflight.py "${{ env.NODE_VERSION }}" --for render; then
            echo "skip_apt=true" >> $GITHUB_OUTPUT
            echo "All deps present, skipping apt-get."
          else
            echo "skip_apt=false" >> $GITHUB_OUTPUT
            echo "Missing deps, will install."
          fi

      - name: Install system deps (only if preflight failed)
        if: steps.preflight.outputs.skip_apt == 'false'
        run: |
          set -euo pipefail
          # P4.3 R-008: Try Ubuntu snapshot for reproducible packages.
          # Falls back to regular archive if snapshot unavailable.
          if [ -n "${UBUNTU_SNAPSHOT:-}" ]; then
            echo "Configuring Ubuntu snapshot: $UBUNTU_SNAPSHOT"
            SNAP_URL="https://snapshot.ubuntu.com/ubuntu/${UBUNTU_SNAPSHOT}"
            # Backup original sources
            sudo cp /etc/apt/sources.list.d/ubuntu.sources /tmp/ubuntu.sources.bak 2>/dev/null || true
            # Create snapshot source (noble + noble-updates, main only)
            sudo tee /etc/apt/sources.list.d/ubuntu-snapshot.sources > /dev/null <<EOF
          Types: deb
          URIs: $SNAP_URL
          Suites: noble noble-updates
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
            # Disable original sources to avoid mixing
            sudo mv /etc/apt/sources.list.d/ubuntu.sources /tmp/ 2>/dev/null || true
            # P4.4 R-008: FAIL CLOSED - no silent fallback to rolling archive.
            # If snapshot fails, stop before rendering with exact error.
            if sudo apt-get update -qq 2>/tmp/apt-snapshot.err; then
              echo "Snapshot configured successfully: $UBUNTU_SNAPSHOT"
            else
              echo "FATAL: Ubuntu snapshot failed: $UBUNTU_SNAPSHOT" >&2
              echo "Exact error:" >&2
              cat /tmp/apt-snapshot.err | head -10 >&2
              echo "Correct UBUNTU_SNAPSHOT or clear it to use rolling archive explicitly." >&2
              exit 1
            fi
          else
            sudo apt-get update -qq
          fi
          # Note: ffmpeg NOT installed on render jobs (only needed for assembly)
          # R-021 (P3.8): ONE unified package set from preflight.py::BROWSER_PACKAGES.
          PKGS=$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from preflight import BROWSER_PACKAGES; print(' '.join(BROWSER_PACKAGES))")
          echo "Installing: $PKGS"
          sudo apt-get install -y -qq --no-install-recommends $PKGS
          # Re-verify after install
          python3 .github/scripts/preflight.py "${{ env.NODE_VERSION }}" --for render

      - name: Install npm deps (pinned)
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          # Verify Remotion version matches pin
          INSTALLED=$(node -p "require('remotion/package.json').version")
          [ "$INSTALLED" = "${{ env.REMOTION_VERSION }}" ] || {
            echo "Remotion version mismatch: got $INSTALLED, expected ${{ env.REMOTION_VERSION }}"
            exit 1
          }
          echo "Remotion $INSTALLED verified."

      - name: Ensure Chromium (cached)
        uses: actions/cache@v4
        with:
          # P3.6: Remotion 4.0.532 downloads the browser to
          # <project>/node_modules/.remotion (NOT ~/.cache/remotion).
          # Verified from @remotion/renderer/dist/browser/get-download-destination.js.
          # This restore runs AFTER `npm ci`, so the directory survives.
          # Exact key only — no restore-keys prefix. Bump -vN to invalidate.
          path: node_modules/.remotion
          key: chromium-${{ env.RUNNER_IMAGE }}-remotion-${{ env.REMOTION_VERSION }}-v1

      - name: Download Chromium if cache missed
        id: browser
        run: |
          set -euo pipefail
          npx remotion browser ensure
          # P3.5.2: `npx remotion browser version` does NOT exist in 4.0.532.
          # Find the actual binary Remotion downloaded.
          # Version is recorded AFTER dependency verification (next step).
          CHROME_BIN=$(find node_modules/.remotion -name "chrome-headless-shell" -type f 2>/dev/null | head -1)
          if [ -z "$CHROME_BIN" ] || [ ! -x "$CHROME_BIN" ]; then
            echo "FATAL: Chromium executable not found in node_modules/.remotion after browser ensure" >&2
            exit 1
          fi
          echo "Chromium binary: $CHROME_BIN"
          echo "binary_path=$CHROME_BIN" >> $GITHUB_OUTPUT
          echo "$CHROME_BIN" > /tmp/chromium_binary.txt

      - name: Verify browser dependencies (real binary)
        run: |
          set -euo pipefail
          # R-021 (P3.6.5): Three-outcome contract via verify_browser_for_render().
          # Python writes the outcome to JSON and exits 0 for all three
          # classified outcomes. Only an unexpected Python crash exits non-zero
          # (set -e then fails closed, which is correct).
          # This avoids the set -e trap where sys.exit(2) would kill the step
          # before the repair branch could run.
          echo "Checking dependencies for: $CHROME_BIN_PATH"
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from preflight import verify_browser_for_render
          binary = os.environ['CHROME_BIN_PATH']
          outcome = verify_browser_for_render(binary)
          with open('/tmp/browser_check.json', 'w') as f:
              json.dump(outcome, f)
          print(f"Outcome: {outcome['outcome']}")
          # Exit 0 for all classified outcomes; shell branches on JSON.
          # Non-zero only on unexpected crash (fail closed via set -e).
          PY
          OUTCOME=$(python3 -c "import json; print(json.load(open('/tmp/browser_check.json'))['outcome'])")
          if [ "$OUTCOME" = "verified" ]; then
            echo "Browser dependencies verified."
          elif [ "$OUTCOME" = "unrepairable" ]; then
            REASON=$(python3 -c "import json; print(json.load(open('/tmp/browser_check.json')).get('reason','unknown'))")
            echo "FATAL: browser unrepairable: $REASON" >&2
            echo "Not a package-install problem; failing closed." >&2
            exit 1
          elif [ "$OUTCOME" = "repairable" ]; then
            echo "Missing dependencies detected; attempting repair..."
            sudo apt-get update -qq
            # R-021 (P3.8): ONE unified package set from preflight.py::BROWSER_PACKAGES.
            # Do not define a separate list here.
            PKGS=$(python3 -c "import sys; sys.path.insert(0, '.github/scripts'); from preflight import BROWSER_PACKAGES; print(' '.join(BROWSER_PACKAGES))")
            echo "Installing: $PKGS"
            sudo apt-get install -y $PKGS
            echo "Rechecking after repair..."
            python3 - <<'PY2'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from preflight import verify_browser_for_render
          binary = os.environ['CHROME_BIN_PATH']
          outcome = verify_browser_for_render(binary)
          with open('/tmp/browser_recheck.json', 'w') as f:
              json.dump(outcome, f)
          print(f"Recheck outcome: {outcome['outcome']}")
          PY2
            RECHECK=$(python3 -c "import json; print(json.load(open('/tmp/browser_recheck.json'))['outcome'])")
            if [ "$RECHECK" = "verified" ]; then
              echo "Browser dependencies verified after repair."
            else
              DETAIL=$(python3 -c "import json; d=json.load(open('/tmp/browser_recheck.json')); print(d.get('reason', d.get('missing','unknown')))")
              echo "FATAL: still failing after repair: $DETAIL" >&2
              exit 1
            fi
          else
            echo "FATAL: unknown browser check outcome: $OUTCOME" >&2
            exit 1
          fi
          # Record version ONLY after executable and dependencies verified.
          CHROME_BIN="$CHROME_BIN_PATH"
          CHROME_VER=$("$CHROME_BIN" --version 2>/dev/null)
          if [ -z "$CHROME_VER" ]; then
            echo "FATAL: version inspection failed for verified binary" >&2
            exit 1
          fi
          echo "Chromium: $CHROME_VER"
          echo "$CHROME_VER" > /tmp/chromium_version.txt
        env:
          CHROME_BIN_PATH: ${{ steps.browser.outputs.binary_path }}

      - name: Render chunk ${{ matrix.chunk.chunk_id }}
        run: |
          set -euo pipefail
          JOB_ID="${{ needs.plan.outputs.job_identity }}"
          CID="${{ matrix.chunk.chunk_id }}"
          START="${{ matrix.chunk.start }}"
          END="${{ matrix.chunk.end }}"

          # P3.6.2: validate inputs via env vars (no raw ${{ inputs.* }} in shell).
          # plan.py already validated, but defense in depth for direct dispatches.
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from plan import validate_composition, validate_crf
          validate_composition(os.environ['COMPOSITION'])
          validate_crf(os.environ['CRF'])
          PY

          # Record render start
          RENDER_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          T0=$(date +%s)

          if ! npx remotion render "$COMPOSITION" \
            /tmp/chunk_${CID}.mp4 \
            --frames=${START}-${END} \
            --concurrency=2 --codec=h264 --crf="$CRF" --overwrite \
            > /tmp/render_${CID}.log 2>&1; then
            echo "RENDER FAILED for chunk $CID (job $JOB_ID)"
            echo "=== render log (tail 50) ==="
            tail -50 /tmp/render_${CID}.log
            exit 1
          fi

          T1=$(date +%s)
          RENDER_END=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DURATION=$((T1 - T0))
          export RENDER_START RENDER_END DURATION

          # Verify output exists and is non-empty
          [ -f /tmp/chunk_${CID}.mp4 ] || { echo "chunk output missing"; exit 1; }
          [ -s /tmp/chunk_${CID}.mp4 ] || { echo "chunk output empty"; exit 1; }

          OUT_SHA=$(sha256sum /tmp/chunk_${CID}.mp4 | cut -d' ' -f1)
          OUT_BYTES=$(stat -c%s /tmp/chunk_${CID}.mp4)
          export OUT_SHA OUT_BYTES
          echo "$OUT_SHA" > /tmp/chunk_${CID}.sha256

          # Build chunk manifest with ACTUAL runtime environment (not placeholders)
          # Collect real versions from the runner — verify_assembly() rejects
          # "unknown" or "resolved-at-render" values.
          ACTUAL_NODE=$(node --version)
          ACTUAL_NPM=$(npm --version)
          ACTUAL_REMOTION=$(node -p "require('remotion/package.json').version")
          # React version: fail closed if not determinable (no "from-lockfile" fallback)
          ACTUAL_REACT=$(node -p "require('react/package.json').version")
          # Chromium version: must have been recorded by the browser step.
          # Fail closed — never accept "unknown" as a measured fact.
          if [ ! -s /tmp/chromium_version.txt ]; then
            echo "FATAL: /tmp/chromium_version.txt missing or empty — Chromium version not measured" >&2
            exit 1
          fi
          ACTUAL_CHROMIUM=$(cat /tmp/chromium_version.txt)
          ACTUAL_OS=$(lsb_release -ds)
          export ACTUAL_NODE ACTUAL_NPM ACTUAL_REMOTION ACTUAL_REACT ACTUAL_CHROMIUM ACTUAL_OS

          python3 - <<PY
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from manifest import build_chunk_manifest
          # Actual runtime environment — every field must be a real measured value
          env_dict = {
              "node_version": os.environ['ACTUAL_NODE'],
              "npm_version": os.environ['ACTUAL_NPM'],
              "remotion_version": os.environ['ACTUAL_REMOTION'],
              "react_version": os.environ['ACTUAL_REACT'],
              "chromium_version": os.environ['ACTUAL_CHROMIUM'],
              "os": os.environ['ACTUAL_OS'],
              "runner_image": "ubuntu-24.04",
          }
          cm = build_chunk_manifest(
              job_identity=os.environ['JOB_ID'],
              chunk_id=int(os.environ['CID']),
              start=int(os.environ['START']),
              end=int(os.environ['END']),
              source_sha=os.environ['GITHUB_SHA'],
              env_dict=env_dict,
              attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
              generation_fingerprint=os.environ['GENERATION_FINGERPRINT'],
          )
          cm['render_started_at'] = os.environ['RENDER_START']
          cm['render_finished_at'] = os.environ['RENDER_END']
          cm['render_duration_s'] = int(os.environ['DURATION'])
          cm['output_bytes'] = int(os.environ['OUT_BYTES'])
          cm['output_sha256'] = os.environ['OUT_SHA']
          cm['validation'] = {'output_exists': True, 'output_non_empty': True}
          with open(f"/tmp/chunk_{os.environ['CID']}_manifest.json", 'w') as f:
              json.dump(cm, f, indent=2)
          print(f"Chunk manifest written for chunk {os.environ['CID']}")
          print(f"  env fingerprint: {cm['env_fingerprint']}")
          PY
        env:
          JOB_ID: ${{ needs.plan.outputs.job_identity }}
          CID: ${{ matrix.chunk.chunk_id }}
          START: ${{ matrix.chunk.start }}
          END: ${{ matrix.chunk.end }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GENERATION_FINGERPRINT: ${{ needs.plan.outputs.generation_fingerprint }}
          COMPOSITION: ${{ inputs.composition }}
          CRF: ${{ inputs.crf }}

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          # P0: artifact name uses canonical identity, NOT manual label
          name: chunk-${{ needs.plan.outputs.job_identity }}-${{ matrix.chunk.chunk_id }}
          path: |
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.mp4
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.sha256
            /tmp/chunk_${{ matrix.chunk.chunk_id }}_manifest.json
          retention-days: 3

  # --- Job 3: Assemble + verify + publish master ---
  assemble:
    needs: [plan, render-chunk]
    # P3.12.1: assembly runs when the plan succeeded. The plan is the source
    # of truth: zero_render=true means all chunks validated reusable;
    # zero_render=false means render-chunk ran (its result is checked below).
    # 2026-10-10: always() is required — when render-chunk is skipped (empty
    # matrix), GitHub skips dependents unless the condition uses always().
    # Do NOT reference needs.render-chunk.result here; the guard step below
    # verifies render success when zero_render is false.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify render completed (guard)
        run: |
          set -euo pipefail
          # P3.12.1 guard: if the plan did NOT declare zero-render, the
          # render-chunk job must have succeeded. Fail closed otherwise.
          ZERO_RENDER="${{ needs.plan.outputs.zero_render }}"
          RENDER_RESULT="${{ needs.render-chunk.result }}"
          echo "zero_render=$ZERO_RENDER render-chunk result=$RENDER_RESULT"
          if [ "$ZERO_RENDER" != "true" ]; then
            if [ "$RENDER_RESULT" != "success" ]; then
              echo "FATAL: render-chunk did not succeed (result=$RENDER_RESULT) and zero_render != true" >&2
              exit 1
            fi
            echo "Render succeeded; assembling fresh chunks."
          else
            echo "Zero-render resume; assembling prior chunks."
          fi

      - name: Install ffmpeg (minimal)
        run: |
          set -euo pipefail
          if ! python3 .github/scripts/preflight.py --for assemble >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          python3 .github/scripts/preflight.py --for assemble | head -5

      - name: Download job manifest
        uses: actions/download-artifact@v4
        with:
          name: job-${{ needs.plan.outputs.job_identity }}
          path: /tmp/job

      - name: Download all chunks (this job only)
        # P3.12.1: skipped on zero-render resume (no new chunks exist).
        if: needs.plan.outputs.zero_render != 'true'
        uses: actions/download-artifact@v4
        with:
          # P0: pattern scoped to canonical identity — no cross-job mixing.
          # P3.12: cross-run reuse is allowed ONLY via an explicit resume plan
          # (resume_from_run_id); the next step downloads authorized prior
          # chunks to a SEPARATE directory. Never merge-multiple across runs.
          pattern: chunk-${{ needs.plan.outputs.job_identity }}-*
          path: /tmp/chunks/current
          merge-multiple: true

      - name: Download authorized prior-run chunks (resume only)
        if: inputs.resume_from_run_id != ''
        run: |
          set -euo pipefail
          # P3.12: download ONLY the chunks the resume plan authorized, from
          # the validated source run, into a separate directory. Prior
          # artifacts keep their original names; nothing is overwritten or
          # relabeled.
          python3 - <<'PY'
          import json, os, subprocess, sys, tempfile, zipfile

          with open('/tmp/job/resume_plan.json') as f:
              plan = json.load(f)
          if not plan.get("enabled"):
              print("Resume not enabled; skipping prior-chunk download")
              sys.exit(0)

          repo = os.environ["REPO"]
          token = os.environ["GITHUB_TOKEN"]
          dest = "/tmp/chunks/prior"
          os.makedirs(dest, exist_ok=True)

          # P4.1: Safe artifact download (handles cross-origin redirects).
          # The GitHub API returns 302 to storage; bearer token is NOT forwarded.
          import urllib.request, urllib.error, urllib.parse
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          def api_get(url):
              req = urllib.request.Request(url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("User-Agent", "cosmo-p4-assembly")
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=60) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as e:
                  print(f"FATAL: API {e.code} for {url.split('?')[0]}",
                        file=sys.stderr)
                  sys.exit(1)
          def download_zip(artifact_id, dest_path, label):
              api_url = (f"https://api.github.com/repos/{repo}/actions/"
                         f"artifacts/{artifact_id}/zip")
              req = urllib.request.Request(api_url)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_unredirected_header("Authorization", f"Bearer {token}")
              req.add_header("User-Agent", "cosmo-p4-assembly")
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  resp = opener.open(req, timeout=60)
              except urllib.error.HTTPError as e:
                  if e.code in (301,302,303,307,308):
                      loc = e.headers.get("Location", "")
                      pr = urllib.parse.urlparse(loc)
                      if pr.scheme != "https" or not pr.hostname:
                          print(f"FATAL: unsafe redirect for {label}",
                                file=sys.stderr)
                          sys.exit(1)
                      # Fetch from storage WITHOUT GitHub bearer token.
                      req2 = urllib.request.Request(loc)
                      req2.add_header("User-Agent", "cosmo-p4-assembly")
                      try:
                          with urllib.request.urlopen(req2, timeout=300) as r2:
                              with open(dest_path, "wb") as f:
                                  while True:
                                      ch = r2.read(65536)
                                      if not ch: break
                                      f.write(ch)
                      except Exception as ex:
                          print(f"FATAL: storage download failed for {label}: {ex}",
                                file=sys.stderr)
                          sys.exit(1)
                  else:
                      print(f"FATAL: API {e.code} for {label}", file=sys.stderr)
                      sys.exit(1)
              else:
                  # No redirect (unexpected but handle)
                  with open(dest_path, "wb") as f:
                      while True:
                          ch = resp.read(65536)
                          if not ch: break
                          f.write(ch)
                  resp.close()
              if os.path.getsize(dest_path) == 0:
                  print(f"FATAL: empty download for {label}", file=sys.stderr)
                  sys.exit(1)

          reuse = plan.get("reuse", [])
          print(f"Downloading {len(reuse)} authorized prior chunks...")
          for r in reuse:
              cid = r["chunk_id"]
              origin_identity = r["origin_job_identity"]
              artifact_name = f"chunk-{origin_identity}-{cid}"
              # Find the exact artifact by name in the source run.
              data = api_get(
                  f"https://api.github.com/repos/{repo}/actions/runs/"
                  f"{r['origin_run_id']}/artifacts?per_page=100")
              aid = ""
              for a in data.get("artifacts", []):
                  if a["name"] == artifact_name:
                      aid = str(a["id"])
                      break
              if not aid:
                  print(f"FATAL: prior chunk artifact not found: {artifact_name}",
                        file=sys.stderr)
                  sys.exit(1)
              zip_path = os.path.join(tempfile.gettempdir(), f"prior_{cid}.zip")
              download_zip(aid, zip_path, artifact_name)
              # Extract into a per-chunk subdirectory to prevent collisions.
              # P4.2: SAFE EXTRACTION - uses artifact_verify.open_archive()
              # Rejects: absolute paths, traversal, symlinks, duplicates,
              # corrupt archives. Never uses unrestricted extractall().
              chunk_dir = os.path.join(dest, f"chunk_{cid}")
              os.makedirs(chunk_dir, exist_ok=True)
              sys.path.insert(0, '.github/scripts')
              from artifact_verify import open_archive, _safe_members
              from artifact_verify import ArchiveError, ArchiveContradiction
              try:
                  zf = open_archive(zip_path)
              except (ArchiveError, ArchiveContradiction) as e:
                  print(f"FATAL: prior chunk {cid} archive unsafe: {e}",
                        file=sys.stderr)
                  sys.exit(1)
              try:
                  for info in _safe_members(zf):
                      # Extract each safe member individually.
                      target = os.path.join(chunk_dir,
                                            os.path.basename(info.filename))
                      # Double-check: basename prevents any directory escape.
                      with zf.open(info) as src, open(target, "wb") as dst:
                          while True:
                              ch = src.read(65536)
                              if not ch:
                                  break
                              dst.write(ch)
              finally:
                  zf.close()
              # Verify extracted video is non-empty.
              extracted = [f for f in os.listdir(chunk_dir)
                           if f.endswith(".mp4")]
              if not extracted:
                  print(f"FATAL: chunk {cid} archive has no video file",
                        file=sys.stderr)
                  sys.exit(1)
              for vf in extracted:
                  vp = os.path.join(chunk_dir, vf)
                  if os.path.getsize(vp) == 0:
                      print(f"FATAL: chunk {cid} video is empty: {vf}",
                            file=sys.stderr)
                      sys.exit(1)
              print(f"  chunk {cid}: downloaded from run {r['origin_run_id']}")
          print(f"Prior chunks staged in {dest}")
          PY
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify manifests + assemble video
        run: |
          set -euo pipefail
          JOB_ID="${{ needs.plan.outputs.job_identity }}"
          echo "Assembling job: $JOB_ID"

          # P0/P1: enforce manifest invariants before touching video.
          # P3.12: resume-aware — chunks from other runs are accepted ONLY
          # when the job manifest's resume plan explicitly authorizes their
          # source run IDs and every chunk passes generation + provenance
          # checks. See manifest.verify_assembly.
          python3 - <<'PY'
          import json, os, sys, glob
          sys.path.insert(0, '.github/scripts')
          from manifest import verify_assembly

          with open('/tmp/job/job_manifest.json') as f:
              job_m = json.load(f)

          # Identity must match
          if job_m['job_identity'] != os.environ['JOB_ID']:
              print(f"FATAL: manifest job {job_m['job_identity']} != expected {os.environ['JOB_ID']}",
                    file=sys.stderr)
              sys.exit(1)

          # Collect chunk manifests: current run's chunks plus, when
          # resuming, authorized prior-run chunks from their separate dir.
          # Directories are never merged; each manifest carries provenance.
          # P3.12.2: also hash each manifest FILE's bytes so assembly can
          # verify origin_manifest_sha256 (original manifest integrity).
          chunk_ms = []
          manifest_file_hashes = {}
          import hashlib
          for mf in sorted(glob.glob('/tmp/chunks/current/chunk_*_manifest.json')):
              with open(mf, 'rb') as fb:
                  file_hash = hashlib.sha256(fb.read()).hexdigest()
              with open(mf) as f:
                  cm = json.load(f)
              chunk_ms.append(cm)
              manifest_file_hashes[cm.get("chunk_id")] = file_hash
          for mf in sorted(glob.glob('/tmp/chunks/prior/chunk_*/chunk_*_manifest.json')):
              with open(mf, 'rb') as fb:
                  file_hash = hashlib.sha256(fb.read()).hexdigest()
              with open(mf) as f:
                  cm = json.load(f)
              chunk_ms.append(cm)
              manifest_file_hashes[cm.get("chunk_id")] = file_hash

          result = verify_assembly(job_m, chunk_ms, manifest_file_hashes)
          if not result['ok']:
              print("ASSEMBLY REJECTED:", file=sys.stderr)
              for e in result['errors']:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          n_reused = sum(1 for c in chunk_ms
                         if (c.get("provenance") or {}).get("reused"))
          print(f"Manifest verification passed: {len(chunk_ms)} chunks "
                f"({n_reused} reused), job {job_m['job_identity']}")
          # Mark stage
          job_m['stage'] = 'video_only'
          with open('/tmp/job/job_manifest.json', 'w') as f:
              json.dump(job_m, f, indent=2)
          PY
        env:
          JOB_ID: ${{ needs.plan.outputs.job_identity }}

      - name: Verify asset manifest provenance
        run: |
          set -euo pipefail
          # P3.6.1: verify the retained asset manifest before publication.
          # Rejects missing, malformed, altered, or mismatched manifests.
          python3 - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from manifest import verify_asset_manifest

          with open('/tmp/job/job_manifest.json') as f:
              job_m = json.load(f)
          with open('/tmp/job/asset_manifest.json') as f:
              asset_m = json.load(f)

          result = verify_asset_manifest(job_m, asset_m, repo_root='.')
          if not result['ok']:
              print("ASSET MANIFEST REJECTED:", file=sys.stderr)
              for e in result['errors']:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print(f"Asset manifest verified: {len(asset_m['files'])} files, "
                f"digest {asset_m['manifest_sha256'][:16]}...")
          PY

      - name: Build chunk ledger (gate)
        # 2026-10-10 (Hamza's rule): the ledger is the ground truth for
        # "which chunks are safely rendered". Assembly NEVER proceeds on an
        # incomplete ledger — it fails naming the exact missing chunk IDs.
        # The ledger is uploaded as an artifact so any future resume or
        # reassembly can read it instead of re-discovering chunk state.
        run: |
          set -euo pipefail
          mkdir -p /tmp/ledger/chunks
          # Normalize: copy every chunk manifest into one flat dir.
          for mf in /tmp/chunks/current/chunk_*_manifest.json; do
            [ -f "$mf" ] && cp "$mf" "/tmp/ledger/chunks/$(basename $mf)"
          done
          for mf in /tmp/chunks/prior/chunk_*/chunk_*_manifest.json; do
            [ -f "$mf" ] && cp "$mf" "/tmp/ledger/chunks/$(basename $mf)"
          done
          python3 .github/scripts/build_ledger.py \
            --job-manifest /tmp/job/job_manifest.json \
            --chunks-dir /tmp/ledger/chunks \
            --out /tmp/ledger/chunk-ledger-${{ needs.plan.outputs.job_identity }}.json

      - name: Upload chunk ledger
        uses: actions/upload-artifact@v4
        with:
          name: chunk-ledger-${{ needs.plan.outputs.job_identity }}
          path: /tmp/ledger/chunk-ledger-${{ needs.plan.outputs.job_identity }}.json
          retention-days: 90

      - name: Verify checksums match manifest
        run: |
          set -euo pipefail
          # P3.12: stage every selected chunk into one flat assembly dir.
          # Current-run chunks come from /tmp/chunks/current/; authorized
          # prior-run chunks from /tmp/chunks/prior/chunk_{id}/. Each video
          # is checksummed against its own manifest before staging.
          # Filenames are canonical (chunk_{id}.mp4); provenance lives in
          # the manifests, not the filenames.
          mkdir -p /tmp/assemble
          python3 - <<'PY'
          import glob, hashlib, json, os, shutil, sys

          def sha256_file(p):
              h = hashlib.sha256()
              with open(p, 'rb') as f:
                  for b in iter(lambda: f.read(65536), b''):
                      h.update(b)
              return h.hexdigest()

          staged = {}
          # Current-run chunks (flat dir)
          sources = glob.glob('/tmp/chunks/current/chunk_*_manifest.json')
          # Prior-run chunks (per-chunk subdirs)
          sources += glob.glob('/tmp/chunks/prior/chunk_*/chunk_*_manifest.json')
          for mf in sorted(sources):
              with open(mf) as f:
                  m = json.load(f)
              cid = m['chunk_id']
              if cid in staged:
                  print(f"FATAL: duplicate staged chunk_id {cid}", file=sys.stderr)
                  sys.exit(1)
              video = os.path.join(os.path.dirname(mf), f"chunk_{cid}.mp4")
              if not os.path.isfile(video):
                  print(f"FATAL: missing video for chunk {cid}: {video}",
                        file=sys.stderr)
                  sys.exit(1)
              expected = m.get('output_sha256')
              actual = sha256_file(video)
              if expected != actual:
                  print(f"FATAL: checksum FAIL chunk {cid}", file=sys.stderr)
                  sys.exit(1)
              dest = f"/tmp/assemble/chunk_{cid}.mp4"
              shutil.copy2(video, dest)
              staged[cid] = m.get('provenance', {}).get('reused', False)
          print(f"all chunk checksums OK: {len(staged)} staged "
                f"({sum(staged.values())} reused)")

          # Assemble in chunk_id order.
          # P4.4 §6.5 FIX: Use -c copy (stream copy, NO re-encode).
          # The old command used -c:v libx264 (re-encode) which duplicated
          # 14 frames at chunk boundaries (23,165 vs 23,151 expected).
          # All chunks are identically-encoded H.264, so stream copy is
          # safe and preserves exact frame counts.
          ordered = sorted(staged.keys())
          with open('/tmp/assemble/concat.txt', 'w') as f:
              for cid in ordered:
                  f.write(f"file 'chunk_{cid}.mp4'\n")
          print(f'Concat list: {len(ordered)} chunks in order')
          PY
          ffmpeg -y -f concat -safe 0 -i /tmp/assemble/concat.txt -c copy /tmp/master_video.mp4
          echo "video assembled: /tmp/master_video.mp4"

      - name: Build concatenated VO (if needed)
        # P4.4: If the VO file doesn't exist (e.g. vo_housingbroke.wav built
        # from parts), concatenate hb_p1..hb_p7 on the runner.
        if: inputs.with_audio
        env:
          VO_FILE: ${{ inputs.vo_file }}
        run: |
          set -euo pipefail
          if [ ! -f "$VO_FILE" ]; then
            echo "VO file not found: $VO_FILE, trying hb_p1..hb_p7..."
            for i in 1 2 3 4 5 6 7; do
              [ -f "public/audio/hb_p${i}.wav" ] || { echo "FATAL: hb_p${i}.wav missing"; exit 1; }
              echo "file '$PWD/public/audio/hb_p${i}.wav'"
            done > /tmp/vo_concat.txt
            ffmpeg -y -f concat -safe 0 -i /tmp/vo_concat.txt -c copy "$VO_FILE"
            echo "Concatenated VO built: $VO_FILE"
          else
            echo "Using VO file: $VO_FILE"
          fi

      - name: Mux canonical audio (VO + music bed)
        if: inputs.with_audio
        run: |
          set -euo pipefail
          FPS=30
          # P3.6.2: inputs via env vars, validated by plan.py already.
          # Validate again here (defense in depth) using plan validators.
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, '.github/scripts')
          from plan import validate_int, validate_repo_path
          validate_int("START_FRAME", os.environ['START_FRAME'], min_val=0)
          validate_int("END_FRAME", os.environ['END_FRAME'], min_val=0)
          validate_repo_path("VO_FILE", os.environ['VO_FILE'], ".")
          validate_repo_path("BED_FILE", os.environ['BED_FILE'], ".")
          PY
          START_S=$(echo "scale=3; $START_FRAME / $FPS" | bc)
          DUR_S=$(echo "scale=3; ($END_FRAME - $START_FRAME + 1) / $FPS" | bc)

          # P3: verify audio assets are real files, not LFS pointers
          for f in "$VO_FILE" "$BED_FILE"; do
            [ -f "$f" ] || { echo "audio missing: $f"; exit 1; }
            if head -c 100 "$f" | grep -q "version https://git-lfs.github.com"; then
              echo "FATAL: $f is an LFS pointer, not real audio"; exit 1
            fi
          done

          ffmpeg -y \
            -i /tmp/master_video.mp4 \
            -ss $START_S -t $DUR_S -i "$VO_FILE" \
            -stream_loop 5 -i "$BED_FILE" \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]atrim=0:${DUR_S},volume=-18dB[bed];[vo][bed]amix=inputs=2:duration=longest[aout]" \
            -map 0:v -map "[aout]" \
            -c:v copy -c:a aac -b:a 192k \
            /tmp/master.mp4
          echo "audio muxed"
        env:
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          VO_FILE: ${{ inputs.vo_file }}
          BED_FILE: ${{ inputs.bed_file }}

      - name: Verify master (video + audio + pipeline)
        run: |
          set -euo pipefail
          # P5: classify output stage honestly.
          # VO + music bed is an INTERMEDIATE — the curated SFX mix is a
          # separate post-production step. Do not label it av_master.
          # P3.6.2: WITH_AUDIO via env var (not raw interpolation).
          if [ "$WITH_AUDIO" = "true" ]; then
            MASTER=/tmp/master.mp4
            STAGE="av_intermediate"
          else
            MASTER=/tmp/master_video.mp4
            cp $MASTER /tmp/master.mp4
            STAGE="video_only"
          fi
          echo "Output stage: $STAGE"

          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 $MASTER)
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 $MASTER)
          FPS_R=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=noprint_wrappers=1:nokey=1 $MASTER)
          # P4.4: nb_frames is unreliable for H.264. Use count_frames.
          FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_read_frames -of default=noprint_wrappers=1:nokey=1 -count_frames $MASTER)
          # Fallback: duration * fps if count_frames fails (use round, not int, for fp precision)
          if [ -z "$FRAMES" ] || [ "$FRAMES" = "N/A" ]; then
            V_DUR_TMP=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $MASTER)
            FRAMES=$(python3 -c "import sys; print(round(float(sys.argv[1]) * 30))" "$V_DUR_TMP")
          fi
          V_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $MASTER)

          [ "$W" = "1920" ] && [ "$H" = "1080" ] || { echo "resolution FAIL"; exit 1; }
          [ "$FPS_R" = "30/1" ] || { echo "fps FAIL: $FPS_R"; exit 1; }
          # P3.6.2: use validated env vars, not raw interpolation
          EXPECTED=$(( END_FRAME - START_FRAME + 1 ))
          [ "$FRAMES" = "$EXPECTED" ] || { echo "frame count FAIL"; exit 1; }
          ffmpeg -v error -i $MASTER -f null - || { echo "decode FAIL"; exit 1; }

          if [ "$WITH_AUDIO" = "true" ]; then
            A_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 $MASTER | wc -l)
            [ "$A_STREAMS" -ge 1 ] || { echo "audio stream MISSING"; exit 1; }
            A_DUR=$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of default=noprint_wrappers=1:nokey=1 $MASTER)
            DIFF=$(echo "$V_DUR - $A_DUR" | bc | tr -d -)
            python3 -c "import sys; sys.exit(0 if abs(float('$DIFF')) < 0.5 else 1)" \
              || { echo "a/v sync FAIL"; exit 1; }
          fi

          [ -f "src/compiled_p3/beat_timeline.json" ] || { echo "beats missing"; exit 1; }
          [ -f "src/compiled_p3/events.json" ] || { echo "events missing"; exit 1; }

          # Record final stage + checksum in job manifest (P5)
          MASTER_SHA=$(sha256sum /tmp/master.mp4 | cut -d' ' -f1)
          python3 - <<PY
          import json
          with open('/tmp/job/job_manifest.json') as f:
              m = json.load(f)
          m['stage'] = "$STAGE"
          m['final_output_sha256'] = "$MASTER_SHA"
          from datetime import datetime, timezone
          m['finished_at'] = datetime.now(timezone.utc).isoformat()
          with open('/tmp/job/job_manifest.json', 'w') as f:
              json.dump(m, f, indent=2)
          print(f"Manifest finalized: stage={m['stage']}")
          PY
          echo "MASTER VERIFIED: ${W}x${H}, ${FRAMES}f, stage=$STAGE"
        env:
          WITH_AUDIO: ${{ inputs.with_audio }}
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}

      - name: Upload master + manifest
        uses: actions/upload-artifact@v4
        with:
          name: master-${{ needs.plan.outputs.job_identity }}
          path: |
            /tmp/master.mp4
            /tmp/job/job_manifest.json
          retention-days: 30
