name: Render Benchmark

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition to benchmark'
        required: true
        default: 'P3Rehearsal'
      frames:
        description: 'Number of frames for benchmark (e.g. 300 = 10s)'
        required: false
        default: '300'

# Measures Remotion per-worker concurrency on a single GitHub runner (4 vCPUs).
# This is DISTINCT from distributed chunk parallelism (multiple runners),
# which is exercised by render-production.yml.
# Only concurrency 1/2/4 are meaningful on a 4-vCPU runner.

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        concurrency: [1, 2, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Install system deps
        run: |
          set -euo pipefail
          SETUP_START=$(date +%s)
          sudo apt-get update -qq
          # P3.6: t64 package names for Ubuntu 24.04 Noble
          sudo apt-get install -y -qq ffmpeg libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 \
            libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64 bc
          SETUP_END=$(date +%s)
          echo "SETUP_ELAPSED=$((SETUP_END - SETUP_START))s" >> $GITHUB_ENV

      - name: Install npm deps
        run: |
          set -euo pipefail
          NPM_START=$(date +%s)
          npm ci --no-audit --no-fund
          NPM_END=$(date +%s)
          echo "NPM_ELAPSED=$((NPM_END - NPM_START))s" >> $GITHUB_ENV

      - name: Ensure Chromium
        run: |
          set -euo pipefail
          npx remotion browser ensure

      - name: Benchmark concurrency=${{ matrix.concurrency }}
        run: |
          set -euo pipefail
          FRAMES=${{ inputs.frames }}
          LAST=$(( FRAMES - 1 ))

          # --- Render phase (timed separately) ---
          RENDER_START=$(date +%s)
          if ! npx remotion render ${{ inputs.composition }} /tmp/bench.mp4 \
            --frames=0-$LAST \
            --concurrency=${{ matrix.concurrency }} --overwrite > /tmp/bench_render.log 2>&1; then
            echo "RENDER FAILED (concurrency=${{ matrix.concurrency }})"
            echo "=== render log (tail 50) ==="
            tail -50 /tmp/bench_render.log
            exit 1
          fi
          RENDER_END=$(date +%s)
          RENDER_ELAPSED=$((RENDER_END - RENDER_START))

          # --- Verify output exists and is valid ---
          [ -f /tmp/bench.mp4 ] || { echo "output missing: /tmp/bench.mp4"; exit 1; }
          [ -s /tmp/bench.mp4 ] || { echo "output empty: /tmp/bench.mp4"; exit 1; }

          OUT_FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 /tmp/bench.mp4)
          OUT_W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 /tmp/bench.mp4)
          OUT_H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 /tmp/bench.mp4)
          OUT_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 /tmp/bench.mp4)

          echo "output: ${OUT_FRAMES} frames, ${OUT_W}x${OUT_H}, ${OUT_DUR}s"

          [ "$OUT_FRAMES" = "$FRAMES" ] || { echo "frame count FAIL: expected $FRAMES got $OUT_FRAMES"; exit 1; }
          [ "$OUT_W" = "1920" ] && [ "$OUT_H" = "1080" ] || { echo "resolution FAIL: ${OUT_W}x${OUT_H}"; exit 1; }

          # Full decode check
          ffmpeg -v error -i /tmp/bench.mp4 -f null - || { echo "decode FAIL"; exit 1; }

          # --- Calculate FPS from successful render only ---
          FPS=$(echo "scale=2; $FRAMES / $RENDER_ELAPSED" | bc)

          echo "concurrency=${{ matrix.concurrency }} render=${RENDER_ELAPSED}s fps=$FPS"
          echo "RESULT concurrency=${{ matrix.concurrency }} setup=${SETUP_ELAPSED:-?} npm=${NPM_ELAPSED:-?} render=${RENDER_ELAPSED}s fps=${FPS} frames=${OUT_FRAMES} res=${OUT_W}x${OUT_H}" >> $GITHUB_STEP_SUMMARY
