name: Render Production (Chunked Parallel)

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Remotion composition ID'
        required: true
        default: 'P3Rehearsal'
      job_id:
        description: 'Job ID (e.g. 2026-001)'
        required: true
      start_frame:
        description: 'First frame (inclusive)'
        required: true
        default: '0'
      end_frame:
        description: 'Last frame (inclusive)'
        required: true
      chunk_size:
        description: 'Frames per chunk'
        required: false
        default: '600'
      max_parallel:
        description: 'Max parallel chunk jobs'
        required: false
        default: '10'
      crf:
        description: 'H.264 CRF (quality)'
        required: false
        default: '18'
      with_audio:
        description: 'Mux canonical VO+music mix (true/false)'
        required: false
        default: 'true'
      vo_file:
        description: 'VO source (relative to repo root)'
        required: false
        default: 'public/audio/vo_p3.wav'
      bed_file:
        description: 'Music bed source (relative to repo root)'
        required: false
        default: 'public/audio/bed.mp3'
      # TEST ONLY: deliberately fail this chunk_id (for retry testing)
      fail_chunk:
        description: 'TEST: fail this chunk_id (-1 = disabled)'
        required: false
        default: '-1'

env:
  NODE_VERSION: '24.20.0'
  REMOTION_VERSION: '4.0.532'

jobs:
  # --- Job 1: Generate the chunk matrix ---
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      job_id: ${{ inputs.job_id }}
    steps:
      - name: Validate numeric bounds
        env:
          START: ${{ inputs.start_frame }}
          END: ${{ inputs.end_frame }}
          SIZE: ${{ inputs.chunk_size }}
          MAX_PARALLEL: ${{ inputs.max_parallel }}
          CRF: ${{ inputs.crf }}
          COMPOSITION: ${{ inputs.composition }}
          JOB_ID: ${{ inputs.job_id }}
          WITH_AUDIO: ${{ inputs.with_audio }}
          VO_FILE: ${{ inputs.vo_file }}
          BED_FILE: ${{ inputs.bed_file }}
        run: |
          python3 - <<'PY'
          import os, re
          def bounded(name, low, high):
              raw = os.environ[name]
              if not re.fullmatch(r"[0-9]+", raw) or not low <= int(raw) <= high:
                  raise SystemExit(f"{name} must be an integer from {low} to {high}")
              return int(raw)
          start = bounded("START", 0, 1_000_000)
          end = bounded("END", 0, 1_000_000)
          bounded("SIZE", 1, 1800)
          bounded("MAX_PARALLEL", 1, 10)
          bounded("CRF", 0, 51)
          if not re.fullmatch(r"[A-Za-z0-9_-]{1,100}", os.environ["COMPOSITION"]):
              raise SystemExit("COMPOSITION must use only letters, digits, underscore, and hyphen (max 100 chars)")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,80}", os.environ["JOB_ID"]):
              raise SystemExit("JOB_ID must use only letters, digits, dot, underscore, and hyphen (max 80 chars)")
          if os.environ["WITH_AUDIO"] not in ("true", "false"):
              raise SystemExit("WITH_AUDIO must be exactly true or false")
          for name in ("VO_FILE", "BED_FILE"):
              value = os.environ[name]
              parts = value.split("/")
              if (not value.startswith("public/audio/") or value.startswith("/") or
                  any(part in ("", ".", "..") for part in parts) or
                  not re.fullmatch(r"[A-Za-z0-9._/-]+", value)):
                  raise SystemExit(f"{name} must be a safe path beneath public/audio/")
          if end < start or end - start + 1 > 100_000:
              raise SystemExit("frame range must be ordered and at most 100000 frames")
          PY
      - id: set
        run: |
          python3 - <<'PY'
          import json, os
          start, end, size = int(os.environ['START']), int(os.environ['END']), int(os.environ['SIZE'])
          chunks = []
          cid = 0
          s = start
          while s <= end:
              e = min(s + size - 1, end)
              chunks.append({"chunk_id": cid, "start": s, "end": e})
              cid += 1; s = e + 1
          print(f"Planning {len(chunks)} chunks for frames {start}-{end}")
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"matrix={json.dumps({'chunk': chunks})}\n")
          PY
        env:
          START: ${{ inputs.start_frame }}
          END: ${{ inputs.end_frame }}
          SIZE: ${{ inputs.chunk_size }}

  # --- Job 2: Render chunks in parallel (matrix) ---
  render-chunk:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # cache disabled for stability

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64

      - name: Install npm deps (pinned)
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: Ensure Chromium (pinned by Remotion)
        working-directory: .
        run: npx remotion browser ensure

      - name: Render chunk ${{ matrix.chunk.chunk_id }}
        working-directory: .
        env:
          COMPOSITION_ID: ${{ inputs.composition }}
          RENDER_CRF: ${{ inputs.crf }}
        run: |
          set -euo pipefail
          # Keep dispatch inputs in environment variables; never interpolate user text into shell code.
          npx remotion render "$COMPOSITION_ID" \
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.mp4 \
            --frames=${{ matrix.chunk.start }}-${{ matrix.chunk.end }} \
            --concurrency=2 --codec=h264 --crf="$RENDER_CRF" --overwrite
          [ -f /tmp/chunk_${{ matrix.chunk.chunk_id }}.mp4 ] || { echo "chunk output missing"; exit 1; }
          sha256sum /tmp/chunk_${{ matrix.chunk.chunk_id }}.mp4 | cut -d' ' -f1 > /tmp/chunk_${{ matrix.chunk.chunk_id }}.sha256
          echo "chunk_id=${{ matrix.chunk.chunk_id }}" > /tmp/chunk_${{ matrix.chunk.chunk_id }}.meta
          echo "start=${{ matrix.chunk.start }}" >> /tmp/chunk_${{ matrix.chunk.chunk_id }}.meta
          echo "end=${{ matrix.chunk.end }}" >> /tmp/chunk_${{ matrix.chunk.chunk_id }}.meta

      - name: Upload chunk artifact
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ needs.plan.outputs.job_id }}-${{ matrix.chunk.chunk_id }}
          path: |
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.mp4
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.sha256
            /tmp/chunk_${{ matrix.chunk.chunk_id }}.meta
          retention-days: 3  # cleanup: chunks expire after assembly

  # --- Job 3: Assemble + verify + publish master ---
  assemble:
    needs: [plan, render-chunk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ needs.plan.outputs.job_id }}-*
          path: /tmp/chunks
          merge-multiple: true

      - name: Verify chunk checksums + assemble video
        env:
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
          CHUNK_SIZE: ${{ inputs.chunk_size }}
        run: |
          set -euo pipefail
          cd /tmp/chunks
          python3 - <<'PY'
          import hashlib, json, os, re
          start, end, size = (int(os.environ[k]) for k in ("START_FRAME", "END_FRAME", "CHUNK_SIZE"))
          metas = sorted((p for p in os.listdir(".") if re.fullmatch(r"chunk_\d+\.meta", p)), key=lambda p: int(p.split("_")[1].split(".")[0]))
          if not metas:
              raise SystemExit("no chunk metadata found")
          expected_start = start
          concat = []
          expected_id = 0
          for meta in metas:
              values = {}
              for line in open(meta, encoding="utf8"):
                  k, sep, v = line.strip().partition("=")
                  if sep: values[k] = v
              cid = int(values.get("chunk_id", "-1"))
              a, b = int(values.get("start", "-1")), int(values.get("end", "-1"))
              if cid != expected_id:
                  raise SystemExit(f"chunk IDs not contiguous: expected {expected_id}, got {cid}")
              expected_end = min(expected_start + size - 1, end)
              if a != expected_start or b != expected_end:
                  raise SystemExit(f"frame coverage gap/overlap/invalid range at chunk {cid}: got {a}-{b}, expected {expected_start}-{expected_end}")
              mp4, sha = f"chunk_{cid}.mp4", f"chunk_{cid}.sha256"
              if not os.path.isfile(mp4) or not os.path.isfile(sha):
                  raise SystemExit(f"missing artifact for chunk {cid}")
              expected = open(sha, encoding="utf8").read().strip()
              actual = hashlib.sha256(open(mp4, "rb").read()).hexdigest()
              if not re.fullmatch(r"[0-9a-f]{64}", expected) or expected != actual:
                  raise SystemExit(f"checksum FAIL chunk {cid}")
              concat.append(mp4)
              expected_start = b + 1
              expected_id += 1
          if expected_start != end + 1:
              raise SystemExit(f"chunk coverage ends at {expected_start - 1}; expected {end}")
          with open("concat.txt", "w", encoding="utf8") as out:
              for p in concat:
                  out.write("file '" + os.path.abspath(p).replace("'", "'\\''") + "'\n")
          print(f"validated {len(concat)} contiguous chunks covering frames {start}-{end}")
          PY
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy /tmp/master_video.mp4
          echo "video assembled: /tmp/master_video.mp4"

      - name: Mux canonical audio (VO + music bed)
        if: inputs.with_audio == 'true'
        env:
          AUDIO_START_FRAME: ${{ inputs.start_frame }}
          AUDIO_END_FRAME: ${{ inputs.end_frame }}
          VO_FILE: ${{ inputs.vo_file }}
          BED_FILE: ${{ inputs.bed_file }}
        run: |
          set -euo pipefail
          # Canonical P3 mix: VO dominant + bed at -18dB (from mix_audio.sh)
          # Audio segment matches the rendered frame range
          FPS=30
          START_S=$(echo "scale=3; $AUDIO_START_FRAME / $FPS" | bc)
          DUR_S=$(echo "scale=3; ($AUDIO_END_FRAME - $AUDIO_START_FRAME + 1) / $FPS" | bc)
          echo "audio segment: start=${START_S}s duration=${DUR_S}s"

          [ -f "$VO_FILE" ] || { echo "VO missing"; exit 1; }
          [ -f "$BED_FILE" ] || { echo "bed missing"; exit 1; }

          ffmpeg -y \
            -i /tmp/master_video.mp4 \
            -ss "$START_S" -t "$DUR_S" -i "$VO_FILE" \
            -ss "$START_S" -t "$DUR_S" -i "$BED_FILE" \
            -filter_complex "[1:a]volume=1.0[vo];[2:a]atrim=0:${DUR_S},volume=-18dB[bed];[vo][bed]amix=inputs=2:duration=shortest[aout]" \
            -map 0:v -map "[aout]" \
            -c:v copy -c:a aac -b:a 192k \
            -shortest \
            /tmp/master.mp4
          echo "audio muxed: /tmp/master.mp4"

      - name: Verify master (video + audio + pipeline)
        env:
          WITH_AUDIO: ${{ inputs.with_audio }}
          START_FRAME: ${{ inputs.start_frame }}
          END_FRAME: ${{ inputs.end_frame }}
        run: |
          set -euo pipefail
          MASTER=/tmp/master.mp4
          if [ "$WITH_AUDIO" != "true" ]; then
            MASTER=/tmp/master_video.mp4
            cp "$MASTER" /tmp/master.mp4
          fi

          echo "=== VIDEO ==="
          W=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 "$MASTER")
          H=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 "$MASTER")
          FPS_R=$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=noprint_wrappers=1:nokey=1 "$MASTER")
          FRAMES=$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=noprint_wrappers=1:nokey=1 "$MASTER")
          V_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MASTER")
          echo "video: ${W}x${H} @ ${FPS_R}fps, ${FRAMES} frames, ${V_DUR}s"

          [ "$W" = "1920" ] && [ "$H" = "1080" ] || { echo "resolution FAIL: ${W}x${H}"; exit 1; }
          [ "$FPS_R" = "30/1" ] || { echo "fps FAIL: $FPS_R"; exit 1; }
          EXPECTED_FRAMES=$(( END_FRAME - START_FRAME + 1 ))
          [ "$FRAMES" = "$EXPECTED_FRAMES" ] || { echo "frame count FAIL: expected $EXPECTED_FRAMES got $FRAMES"; exit 1; }

          ffmpeg -v error -i "$MASTER" -f null - || { echo "decode FAIL"; exit 1; }
          echo "video OK"

          echo "=== AUDIO ==="
          if [ "$WITH_AUDIO" = "true" ]; then
            A_STREAMS=$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$MASTER" | wc -l)
            [ "$A_STREAMS" -ge 1 ] || { echo "audio stream MISSING"; exit 1; }
            A_DUR=$(ffprobe -v error -select_streams a:0 -show_entries stream=duration -of default=noprint_wrappers=1:nokey=1 "$MASTER")
            if ! [[ "$A_DUR" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "audio duration unavailable or invalid: $A_DUR"
              exit 1
            fi
            echo "audio: ${A_STREAMS} stream(s), ${A_DUR}s (video ${V_DUR}s)"
            # audio duration must match video within 0.5s
            DIFF=$(echo "$V_DUR - $A_DUR" | bc | tr -d -)
            echo "a/v duration diff: ${DIFF}s"
            python3 -c "import sys; sys.exit(0 if abs(float('$DIFF')) < 0.5 else 1)" || { echo "a/v sync FAIL: diff ${DIFF}s"; exit 1; }
            echo "audio OK"
          else
            echo "audio skipped (with_audio=false)"
          fi

          echo "=== PIPELINE ==="
          # verify composition inputs exist
          [ -f "src/compiled_p3/beat_timeline.json" ] || { echo "beats missing"; exit 1; }
          [ -f "src/compiled_p3/events.json" ] || { echo "events missing"; exit 1; }
          echo "pipeline inputs OK"

          echo "MASTER VERIFIED: ${W}x${H}, ${FRAMES}f, audio=$WITH_AUDIO"

      - name: Upload master
        uses: actions/upload-artifact@v4
        with:
          name: master-${{ needs.plan.outputs.job_id }}
          path: /tmp/master.mp4
          retention-days: 30
