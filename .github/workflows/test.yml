name: CI Tests

on:
  push:
    branches: [p4-4-ccdecbc-readiness]
  pull_request:
    branches: [p4-4-ccdecbc-readiness]
  workflow_dispatch:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python3 -m pip install pytest pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run Python tests
        run: |
          python3 -m pytest tests/ -v --tb=short
      - name: Run hardcoded-scene prevention test
        run: |
          python3 tests/test_no_hardcoded_scenes.py

  visual-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate composition contracts
        run: |
          python3 .github/scripts/composition_contract.py
